<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLs no Congresso — MudaBrasil</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="../js/header.js"></script>
  <style>
    body{margin:0;font-family:'Manrope',sans-serif;background:#0E1726;color:#fff;min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto;padding:48px 24px 80px}
    h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.8rem,3.5vw,2.6rem);margin:0 0 8px;background:linear-gradient(135deg,#AECF00,#4a7bc2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{color:#94A3B8;margin:0 0 32px;font-size:1.05rem}
    .back{display:inline-flex;align-items:center;gap:6px;color:#AECF00;text-decoration:none;font-weight:700;margin-bottom:24px;font-size:0.9rem}
    .back:hover{text-decoration:underline}
    .grid{display:grid;gap:18px}
    .pl{background:linear-gradient(155deg,#152339 0%,#101D33 100%);border:1px solid rgba(90,107,126,0.28);border-radius:16px;padding:24px;transition:all 0.25s}
    .pl:hover{border-color:#3465A4;transform:translateY(-2px)}
    .pl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:12px}
    .pl-num{font-family:'Montserrat',sans-serif;font-weight:900;font-size:0.9rem;color:#AECF00;background:rgba(174,207,0,0.12);padding:4px 10px;border-radius:6px;letter-spacing:0.05em}
    .pl-status{font-size:0.78rem;font-weight:700;padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:0.05em}
    .st-camara{background:rgba(52,101,164,0.18);color:#7eb0e3}
    .st-senado{background:rgba(0,151,57,0.18);color:#5fdf8a}
    .st-sancao{background:rgba(174,207,0,0.18);color:#c4e034}
    .pl h3{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.15rem;margin:0 0 8px;line-height:1.3}
    .pl-meta{color:#94A3B8;font-size:0.85rem;margin:0 0 16px}
    .pl-bar{height:8px;background:#1f2c45;border-radius:4px;overflow:hidden;display:flex;margin-bottom:8px}
    .bar-sim{background:#009739;height:100%}
    .bar-nao{background:#dc2626;height:100%}
    .pl-votes{display:flex;justify-content:space-between;font-size:0.8rem;color:#94A3B8;margin-bottom:14px}
    .pl-votes b{font-family:'Montserrat',sans-serif;color:#fff}
    .pl-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn-vote{padding:8px 16px;border-radius:50px;font-size:0.78rem;font-weight:800;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em}
    .btn-sim{background:rgba(0,151,57,0.18);color:#5fdf8a;border:1px solid rgba(0,151,57,0.35)}
    .btn-nao{background:rgba(220,38,38,0.18);color:#fca5a5;border:1px solid rgba(220,38,38,0.35)}
    .btn-vote:hover{transform:translateY(-1px)}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .sel{background:#152339;color:#fff;border:1px solid rgba(90,107,126,0.28);padding:9px 14px;border-radius:10px;font-size:0.85rem;font-family:inherit}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back">← Voltar para o Início</a>
    <h1>📜 PLs no Congresso</h1>
    <p class="sub">Acompanhe os projetos de lei em tramitação e dê seu apoio ou rejeição.</p>

    <div class="filter-bar">
      <select class="sel" id="casa">
        <option>Todas as casas</option>
        <option>Câmara</option><option>Senado</option><option>Sanção Presidencial</option>
      </select>
      <select class="sel" id="tema">
        <option>Todos os temas</option>
        <option>Economia</option><option>Educação</option>
        <option>Saúde</option><option>Meio Ambiente</option>
        <option>Segurança</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const PLS = [
      {num:'PL 1234/2026',titulo:'Programa Nacional de Restauração Ambiental',autor:'Dep. Carlos Souza (MDB/RJ)',casa:'camara',tema:'Meio Ambiente',sim:62,nao:38},
      {num:'PL 5678/2026',titulo:'Reforma do Ensino Médio com foco em tecnologia',autor:'Sen. Ana Beatriz (PSOL/BA)',casa:'senado',tema:'Educação',sim:54,nao:46},
      {num:'PL 9101/2026',titulo:'Ampliação do programa Saúde da Família',autor:'Dep. Maria Silva (PT/SP)',casa:'camara',tema:'Saúde',sim:71,nao:29},
      {num:'PL 2468/2026',titulo:'Redução de jornada de trabalho para 36h semanais',autor:'Sen. Felipe Santos (PP/MG)',casa:'senado',tema:'Economia',sim:48,nao:52},
      {num:'PL 8024/2026',titulo:'Lei de Proteção de Dados Eleitorais',autor:'Sen. Juliana Costa (REDE/SP)',casa:'sancao',tema:'Segurança',sim:78,nao:22},
      {num:'PL 3456/2026',titulo:'Criminalização do assédio em ambiente digital',autor:'Dep. Camila Rocha (PSB/RJ)',casa:'camara',tema:'Segurança',sim:65,nao:35},
    ];
    const stClass={camara:'st-camara',senado:'st-senado',sancao:'st-sancao'};
    const stLabel={camara:'Câmara',senado:'Senado',sancao:'Sanção'};
    const grid=document.getElementById('grid');
    grid.innerHTML=PLS.map(p=>{
      return `<article class="pl">
        <div class="pl-top">
          <span class="pl-num">${p.num}</span>
          <span class="pl-status ${stClass[p.casa]}">${stLabel[p.casa]}</span>
        </div>
        <h3>${p.titulo}</h3>
        <p class="pl-meta">${p.autor} · ${p.tema}</p>
        <div class="pl-bar"><div class="bar-sim" style="width:${p.sim}%"></div><div class="bar-nao" style="width:${p.nao}%"></div></div>
        <div class="pl-votes"><span>👍 Apoiar: <b>${p.sim}%</b></span><span>👎 Rejeitar: <b>${p.nao}%</b></span></div>
        <div class="pl-actions">
          <button class="btn-vote btn-sim" onclick="alert('Para votar, cadastre-se no MudaBrasil.')">👍 Apoiar</button>
          <button class="btn-vote btn-nao" onclick="alert('Para votar, cadastre-se no MudaBrasil.')">👎 Rejeitar</button>
        </div>
      </article>`;
    }).join('');
  </script>
</body>
</html>
