<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Políticos com Votos Revogados — MudaBrasil</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:'Manrope',sans-serif;background:#0E1726;color:#fff;min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto;padding:48px 24px 80px}
    h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.8rem,3.5vw,2.6rem);margin:0 0 8px;background:linear-gradient(135deg,#dc2626,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{color:#94A3B8;margin:0 0 32px;font-size:1.05rem}
    .back{display:inline-flex;align-items:center;gap:6px;color:#AECF00;text-decoration:none;font-weight:700;margin-bottom:24px;font-size:0.9rem}
    .back:hover{text-decoration:underline}
    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
    .stat{background:linear-gradient(155deg,#152339,#101D33);border:1px solid rgba(90,107,126,0.28);border-radius:14px;padding:18px;text-align:center}
    .stat-n{font-family:'Montserrat',sans-serif;font-weight:900;font-size:2rem;background:linear-gradient(135deg,#dc2626,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px}
    .stat-l{color:#94A3B8;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.06em}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .card{background:linear-gradient(155deg,#152339,#101D33);border:1px solid rgba(220,38,38,0.25);border-radius:16px;padding:22px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#dc2626,#ff8c00)}
    .nome{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.05rem;margin:0 0 4px}
    .role{color:#94A3B8;font-size:0.85rem;margin:0 0 14px}
    .motivo{background:rgba(220,38,38,0.1);border-left:3px solid #dc2626;padding:10px 12px;border-radius:6px;font-size:0.85rem;color:#fca5a5;margin:12px 0;line-height:1.5}
    .meta{display:flex;justify-content:space-between;font-size:0.78rem;color:#94A3B8;padding-top:12px;border-top:1px solid rgba(90,107,126,0.2)}
    .meta b{color:#fff;font-family:'Montserrat',sans-serif}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .sel{background:#152339;color:#fff;border:1px solid rgba(90,107,126,0.28);padding:9px 14px;border-radius:10px;font-size:0.85rem;font-family:inherit}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back">← Voltar para o Início</a>
    <h1>⚖️ Políticos com Votos Revogados</h1>
    <p class="sub">Lista pública de políticos que perderam a confiança dos cidadãos no MudaBrasil.</p>

    <div class="summary">
      <div class="stat"><div class="stat-n">127</div><div class="stat-l">Total revogados</div></div>
      <div class="stat"><div class="stat-n">38</div><div class="stat-l">Este mês</div></div>
      <div class="stat"><div class="stat-n">12</div><div class="stat-l">Esta semana</div></div>
      <div class="stat"><div class="stat-n">73%</div><div class="stat-l">Por descumprimento</div></div>
    </div>

    <div class="filter-bar">
      <select class="sel" id="cargo">
        <option>Todos os cargos</option>
        <option>Dep. Federal</option><option>Senador</option>
        <option>Governador</option><option>Prefeito</option><option>Vereador</option>
      </select>
      <select class="sel" id="motivo">
        <option>Todos os motivos</option>
        <option>Descumprimento de promessa</option>
        <option>Envolvimento em escândalo</option>
        <option>Mudança de posição</option>
        <option>Abandono do cargo</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const REVOGADOS = [
      {nome:'Roberto Alves',cargo:'Vereador · NOVO/PR',motivo:'Prometeu transparência total e votou a favor de aumento do próprio salário em 2025.',total:342,quando:'há 3 dias'},
      {nome:'Felipe Santos',cargo:'Senador · PP/MG',motivo:'Mudou de posição sobre reforma tributária após lobby de grandes empresas.',total:1287,quando:'há 1 semana'},
      {nome:'João Pereira',cargo:'Dep. Estadual · PL/MG',motivo:'Abandonou 18 sessões consecutivas sem justificativa válida.',total:892,quando:'há 2 semanas'},
      {nome:'Patrícia Lima',cargo:'Prefeita · PSD/RS',motivo:'Envolvida em esquema de superfaturamento de obras públicas.',total:2154,quando:'há 3 semanas'},
      {nome:'Camila Rocha',cargo:'Dep. Estadual · PSB/RJ',motivo:'Votou contra projeto de proteção ambiental de sua própria base eleitoral.',total:567,quando:'há 1 mês'},
      {nome:'Renato Vieira',cargo:'Dep. Federal · PTB/SP',motivo:'Prometeu combate à corrupção e foi flagrado em operação da PF.',total:3421,quando:'há 2 meses'},
    ];
    const grid=document.getElementById('grid');
    grid.innerHTML=REVOGADOS.map(p=>`<div class="card">
      <h3 class="nome">${p.nome}</h3>
      <p class="role">${p.cargo}</p>
      <div class="motivo"><b>Motivo:</b> ${p.motivo}</div>
      <div class="meta"><span>Votos revogados: <b>${p.total.toLocaleString('pt-BR')}</b></span><span>${p.quando}</span></div>
    </div>`).join('');
  </script>
</body>
</html>
