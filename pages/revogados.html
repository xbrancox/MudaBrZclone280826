<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Políticos Revogados — MudaBrasil</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="../js/header.js"></script>
  <style>
    body{margin:0;font-family:'Manrope',sans-serif;background:#0E1726;color:#fff;min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto;padding:48px 24px 80px}
    h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.8rem,3.5vw,2.6rem);margin:0 0 8px}
    h1 .c-blue{color:#4a7bc2}
    h1 .c-green{color:#009739}
    .sub{color:#94A3B8;margin:0 0 32px;font-size:1.02rem;line-height:1.6}
    .back{display:inline-flex;align-items:center;gap:6px;color:#AECF00;text-decoration:none;font-weight:700;margin-bottom:24px;font-size:0.9rem}
    .back:hover{text-decoration:underline}

    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
    .stat{background:linear-gradient(155deg,#152339,#101D33);border:1px solid rgba(90,107,126,0.28);border-radius:14px;padding:18px;text-align:center}
    .stat-n{font-family:'Montserrat',sans-serif;font-weight:900;font-size:2rem;line-height:1;margin-bottom:4px;color:#AECF00}
    .stat-l{color:#94A3B8;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.06em}

    .top-list{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
    .top-badge{background:linear-gradient(155deg,#152339,#101D33);border:1px solid rgba(174,207,0,0.25);border-radius:9999px;padding:8px 16px;font-size:0.8rem;font-weight:700;display:flex;align-items:center;gap:8px}
    .top-pos{background:#AECF00;color:#0E1726;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:900;flex-shrink:0}
    .top-name{color:#fff}
    .top-votes{color:#AECF00;white-space:nowrap}

    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .field{flex:1;min-width:160px}
    .field label{display:block;font-size:0.68rem;font-weight:800;color:#5A6B7E;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
    .sel,.txt{width:100%;background:#152339;color:#fff;border:1px solid rgba(90,107,126,0.28);padding:10px 14px;border-radius:10px;font-size:0.85rem;font-family:inherit}
    .txt:focus,.sel:focus{outline:none;border-color:#AECF00}

    .count{font-size:0.8rem;color:#5A6B7E;margin:0 0 14px}
    .count b{color:#AECF00}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
    .card{background:linear-gradient(155deg,#152339,#101D33);border:1px solid rgba(90,107,126,0.28);border-radius:16px;padding:22px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#AECF00,#3465A4)}
    .nome{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.05rem;margin:0 0 2px}
    .poli-meta{color:#94A3B8;font-size:0.82rem;margin:0 0 12px}
    .poli-meta span{display:inline-block;margin-right:8px}
    .poli-meta .b{color:#7eb0e3}
    .motivo{background:rgba(174,207,0,0.07);border-left:3px solid #AECF00;padding:10px 12px;border-radius:6px;font-size:0.85rem;color:#c4e034;margin:12px 0;line-height:1.5}
    .progress-wrap{margin:12px 0}
    .progress-label{display:flex;justify-content:space-between;font-size:0.78rem;color:#94A3B8;margin-bottom:4px}
    .progress-label b{color:#fff;font-family:'Montserrat',sans-serif}
    .progress-track{height:8px;background:#1f2c45;border-radius:4px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#AECF00,#3465A4);border-radius:4px;transition:width 0.4s}
    .meta{display:flex;justify-content:space-between;font-size:0.78rem;color:#94A3B8;padding-top:12px;border-top:1px solid rgba(90,107,126,0.2)}
    .meta b{color:#fff;font-family:'Montserrat',sans-serif}

    .pct-high{color:#5fdf8a}
    .pct-mid{color:#c4e034}
    .pct-low{color:#ffc94d}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html" class="back">← Voltar para o Início</a>
    <h1><span class="c-blue">Políticos</span> <span class="c-green">Revogados</span></h1>
    <p class="sub">Cidadãos que já revogaram o mandato de seus representantes. <strong>70%</strong> dos votos totais é o mínimo exigido para cassação.</p>

    <div class="summary">
      <div class="stat"><div class="stat-n">127</div><div class="stat-l">Total revogados</div></div>
      <div class="stat"><div class="stat-n">38</div><div class="stat-l">Este mês</div></div>
      <div class="stat"><div class="stat-n">12</div><div class="stat-l">Esta semana</div></div>
      <div class="stat"><div class="stat-n">73%</div><div class="stat-l">Por descumprimento</div></div>
    </div>

    <p class="count" style="color:#94A3B8;margin-bottom:8px;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em">🏆 Top 3 Mais Revogados</p>
    <div class="top-list" id="top-list"></div>

    <div class="filter-bar">
      <div class="field"><label>Nome</label><input class="txt" id="f-nome" placeholder="Buscar por nome" oninput="render()"></div>
      <div class="field"><label>Partido</label><select class="sel" id="f-partido" onchange="render()"></select></div>
      <div class="field"><label>Estado</label><select class="sel" id="f-estado" onchange="render()"></select></div>
    </div>

    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const REVOGADOS = [
      {nome:'Roberto Alves',partido:'NOVO',estado:'PR',cargo:'Vereador',motivo:'Prometeu transparência total e votou a favor de aumento do próprio salário em 2025.',votos:342,meta:500,quando:'há 3 dias'},
      {nome:'Felipe Santos',partido:'PP',estado:'MG',cargo:'Senador',motivo:'Mudou de posição sobre reforma tributária após lobby de grandes empresas.',votos:1287,meta:1840,quando:'há 1 semana'},
      {nome:'João Pereira',partido:'PL',estado:'MG',cargo:'Dep. Estadual',motivo:'Abandonou 18 sessões consecutivas sem justificativa válida.',votos:892,meta:1275,quando:'há 2 semanas'},
      {nome:'Patrícia Lima',partido:'PSD',estado:'RS',cargo:'Prefeita',motivo:'Envolvida em esquema de superfaturamento de obras públicas.',votos:2154,meta:3078,quando:'há 3 semanas'},
      {nome:'Camila Rocha',partido:'PSB',estado:'RJ',cargo:'Dep. Estadual',motivo:'Votou contra projeto de proteção ambiental de sua própria base eleitoral.',votos:567,meta:810,quando:'há 1 mês'},
      {nome:'Renato Vieira',partido:'PTB',estado:'SP',cargo:'Dep. Federal',motivo:'Prometeu combate à corrupção e foi flagrado em operação da PF.',votos:3421,meta:4888,quando:'há 2 meses'},
    ];

    const partSel=document.getElementById('f-partido');
    partSel.innerHTML='<option value="">Todos os partidos</option>'+[...new Set(REVOGADOS.map(p=>p.partido))].sort().map(pa=>`<option>${pa}</option>`).join('');
    const estSel=document.getElementById('f-estado');
    estSel.innerHTML='<option value="">Todos os estados</option>'+[...new Set(REVOGADOS.map(p=>p.estado))].sort().map(es=>`<option>${es}</option>`).join('');

    function pctClass(v,meta){
      const p=v/meta*100;
      if(p>=70)return 'pct-high';
      if(p>=40)return 'pct-mid';
      return 'pct-low';
    }

    function render(){
      const qn=document.getElementById('f-nome').value.trim().toLowerCase();
      const qp=document.getElementById('f-partido').value;
      const qe=document.getElementById('f-estado').value;
      const list=REVOGADOS.filter(p=>
        (!qn||p.nome.toLowerCase().includes(qn)||p.partido.toLowerCase().includes(qn)||p.cargo.toLowerCase().includes(qn))&&
        (!qp||p.partido===qp)&&
        (!qe||p.estado===qe)
      );
      document.getElementById('count').innerHTML=`<b>${list.length}</b> político(s) encontrado(s)`;
      const grid=document.getElementById('grid');
      grid.innerHTML=list.map(p=>{
        const pct=Math.min(p.votos/p.meta*100,100);
        const cls=pctClass(p.votos,p.meta);
        return `<div class="card">
          <h3 class="nome">${p.nome}</h3>
          <p class="poli-meta"><span class="b">${p.partido}</span> / ${p.estado} · ${p.cargo}</p>
          <div class="motivo"><b>Motivo:</b> ${p.motivo}</div>
          <div class="progress-wrap">
            <div class="progress-label"><span>Votos revogados: <b>${p.votos.toLocaleString('pt-BR')}</b> / ${p.meta.toLocaleString('pt-BR')}</span><span class="${cls}"><b>${pct.toFixed(0)}%</b></span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div style="font-size:0.7rem;color:#5A6B7E;margin-top:3px">Mínimo 70% para cassação</div>
          </div>
          <div class="meta"><span>Votos necessários: <b>${Math.max(0,p.meta-p.votos).toLocaleString('pt-BR')}</b></span><span>${p.quando}</span></div>
        </div>`;
      }).join('');

      // Top 3
      const top=[...REVOGADOS].sort((a,b)=>b.votos-a.votos).slice(0,3);
      document.getElementById('top-list').innerHTML=top.map((p,i)=>`<div class="top-badge"><span class="top-pos">${i+1}</span><span class="top-name">${p.nome}</span><span class="top-votes">${p.votos.toLocaleString('pt-BR')} revogados</span></div>`).join('');
    }
    render();
  </script>
</body>
</html>
